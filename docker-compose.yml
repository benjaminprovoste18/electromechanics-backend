services:
  oracle-db:
    image: gvenzl/oracle-free:23-slim
    container_name: oracle_emterreno
    restart: always
    environment:
      ORACLE_PASSWORD: ${ORACLE_PASSWORD}
      APP_USER: ${DB_USER}
      APP_USER_PASSWORD: ${DB_PASSWORD}
      TZ: America/Santiago
    ports:
      - "1521:1521"
    volumes:
      - oracle_data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 60s

  ms-sucursales:
    build: ./ms-sucursales
    container_name: ms_sucursales
    restart: always
    depends_on:
      oracle-db:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      PORT: 8081
      DB_URL: jdbc:oracle:thin:@oracle-db:1521/FREEPDB1
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DDL_AUTO: update
      SHOW_SQL: "false"
      TZ: America/Santiago

  ms-ordenes:
    build: ./ms-ordenes
    container_name: ms_ordenes
    restart: always
    depends_on:
      oracle-db:
        condition: service_healthy
    ports:
      - "8082:8082"
    environment:
      PORT: 8082
      DB_URL: jdbc:oracle:thin:@oracle-db:1521/FREEPDB1
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DDL_AUTO: update
      SHOW_SQL: "false"
      TZ: America/Santiago

  ms-jornadas:
    build: ./ms-jornadas
    container_name: ms_jornadas
    restart: always
    depends_on:
      oracle-db:
        condition: service_healthy
      ms-sucursales:
        condition: service_started
    ports:
      - "8083:8083"
    environment:
      PORT: 8083
      DB_URL: jdbc:oracle:thin:@oracle-db:1521/FREEPDB1
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DDL_AUTO: update
      SHOW_SQL: "false"
      SUCURSALES_URL: http://ms-sucursales:8081
      TZ: America/Santiago

volumes:
  oracle_data:
